# Conda environment for IsPersonalizationReal.
#
# Conda supplies the INTERPRETER ONLY. Every library comes from PyPI via
# requirements.txt, so there is one dependency list and one binary source.
#
# WHY. The previous version took numpy/scipy/opencv from conda-forge and torch from
# pip. That loads two OpenMP runtimes into a single process on macOS -- conda-forge's
# llvm-openmp plus the libomp.dylib bundled inside the torch wheel -- and Python
# aborts at import with "OMP: Error #15". The documented workaround,
# KMP_DUPLICATE_LIB_OK=TRUE, is described by its own authors as unsupported and able
# to "silently produce incorrect results", which is not a trade worth making in a
# research pipeline: you would have no way to tell it had happened.
#
#   conda env create -f environment.yml
#   conda activate ispersonalizationreal
#   python scripts/check_openmp.py
#   python scripts/smoke_test.py
#   python scripts/capture_env.py
#
# Rename the env by editing `name:` below.

name: ispersonalizationreal

channels:
  - conda-forge

dependencies:
  - python=3.11          # torch, opencv and statsmodels all have solid 3.11 wheels
  - pip
  - pip:
      - -r requirements.txt
